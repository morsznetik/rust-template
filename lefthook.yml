pre-commit:
  parallel: true
  commands:
    typos:
      run: typos
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings

commit-msg:
  commands:
    dco:
      run: "git interpret-trailers --parse {1} | grep -Eq '^Signed-off-by: .+ <.+>$'"
      fail_text: "Commit is missing DCO"
      
pre-push:
  commands:
    test:
      run: cargo test --workspace
