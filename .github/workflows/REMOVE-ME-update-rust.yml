name: Update Rust and dependencies

on:
  schedule:
    - cron: "23 7 1 * *" # avoid rush hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-rust
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'morsznetik/rust-template'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [crates, simple]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Resolve latest nightly
        id: rust
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.request import urlopen

          with urlopen(
              "https://static.rust-lang.org/dist/channel-rust-nightly.toml",
              timeout=60,
          ) as response:
              manifest = tomllib.loads(response.read().decode())

          channel = f"nightly-{manifest['date']}"
          version = manifest["pkg"]["rust"]["version"].split()[0].removesuffix("-nightly")

          def update(path, key, value):
              content, count = re.subn(
                  rf'^(\s*{key}\s*=\s*)"[^"]+"',
                  lambda match: f'{match[1]}"{value}"',
                  path.read_text(),
                  flags=re.MULTILINE,
              )
              assert count == 1, f"expected one {key} in {path}, got {count}"
              path.write_text(content)

          update(Path("rust-toolchain.toml"), "channel", channel)
          update(Path("Cargo.toml"), "rust-version", version)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"channel={channel}", file=output)
              print(f"version={version}", file=output)

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo update
      - uses: crate-ci/typos@v1.49.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: updates/rust-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          delete-branch: true
          draft: true
          sign-commits: true
          signoff: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "build: update Rust to ${{ steps.rust.outputs.channel }} and dependencies"
          title: "Update ${{ matrix.branch }} to ${{ steps.rust.outputs.channel }} and refresh dependencies"
          body: |
            Updates Rust to ${{ steps.rust.outputs.version }} (`${{ steps.rust.outputs.channel }}`) and refreshes dependencies.
          add-paths: |
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
